# Builds and signs one plugin's .fkplugin from plugins/<id>/src/, attaches it to
# a GitHub Release, and commits it under plugins/<id>/dist/ so publish.yml's next
# Pages deploy serves it at a stable URL (Pages replaces its whole tree on every
# deploy — the only way a plugin download URL survives that is to live in the
# git tree, same as catalog.json). Signs with CATALOG_SIGNING_KEY, the same key
# that signs catalog.json — see docs/key-rotation.md for what that buys.
#
# With `version` set (a pluginApi 2 wasm plugin) the sources are the assets of the plugin repo's
# release named by the entry's zipUrl, and the signed archive is uploaded back to that release;
# nothing is committed under dist/. That cross-repo access needs the PLUGIN_REPO_TOKEN secret.
name: Package plugin

on:
  workflow_dispatch:
    inputs:
      pluginId:
        description: 'Plugin id under plugins/<id>/src/ (matches its directory name)'
        required: true
        type: string
      version:
        description: 'Set for a wasm plugin released from its own repo: reads plugins/<id>/versions/<version>.json'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  # Only needed to kick publish.yml after the commit below: a push made with the
  # default GITHUB_TOKEN does not trigger other workflows' `on: push`.
  actions: write

concurrency:
  group: package-plugin-${{ inputs.pluginId }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Refuse to package unsigned
        run: |
          if [ -z "${CATALOG_SIGNING_KEY}" ]; then
            echo "::error::CATALOG_SIGNING_KEY is not set on this repository. A data plugin can install unsigned, but this repo's own plugin must be signed by the catalog key to resolve to 'official' — see docs/key-rotation.md."
            exit 1
          fi
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}

      - name: Refuse a wasm run without the cross-repo token
        if: inputs.version != ''
        run: |
          if [ -z "${PLUGIN_REPO_TOKEN}" ]; then
            echo "::error::PLUGIN_REPO_TOKEN is not set: a fine-grained token with Contents read/write on the plugin repo."
            exit 1
          fi
        env:
          PLUGIN_REPO_TOKEN: ${{ secrets.PLUGIN_REPO_TOKEN }}

      - name: Fetch the wasm plugin's release assets
        if: inputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_REPO_TOKEN }}
        run: |
          URL=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).zipUrl' \
            "plugins/${{ inputs.pluginId }}/versions/${{ inputs.version }}.json")
          PATTERN='^https://github.com/([^/]+/[^/]+)/releases/download/([^/]+)/[^/]+$'
          [[ "$URL" =~ $PATTERN ]] || { echo "::error::zipUrl is not a GitHub Release asset: $URL"; exit 1; }
          echo "PLUGIN_REPO=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          echo "PLUGIN_TAG=${BASH_REMATCH[2]}" >> "$GITHUB_ENV"
          gh release download "${BASH_REMATCH[2]}" -R "${BASH_REMATCH[1]}" -D "$RUNNER_TEMP/src" \
            -p plugin.json -p plugin.wasm -p 'logo.*'

      - name: Build and sign
        id: package
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            node scripts/package-plugin.mjs "${{ inputs.pluginId }}" --src "$RUNNER_TEMP/src" --out "$RUNNER_TEMP/out"
          else
            node scripts/package-plugin.mjs "${{ inputs.pluginId }}"
          fi
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}

      - name: Upload the signed archive to the plugin repo's release
        if: inputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_REPO_TOKEN }}
        run: |
          if [ "${{ steps.package.outputs.version }}" != "${{ inputs.version }}" ]; then
            echo "::error::plugin.json version ${{ steps.package.outputs.version }} is not ${{ inputs.version }}"
            exit 1
          fi
          # The signature is deterministic, so a re-run uploads identical bytes.
          gh release upload "$PLUGIN_TAG" "${{ steps.package.outputs.distPath }}" -R "$PLUGIN_REPO" --clobber

      # An Ed25519 signature is key-dependent, so the archive's hash is only
      # knowable once it has been signed with the real key. Writing it here is
      # what keeps the catalog entry and the published bytes in agreement — a
      # hand-copied hash is a checksum mismatch waiting to happen.
      - name: Record the published hash on the catalog entry
        run: |
          node -e '
            const fs = require("fs");
            const [file, sha] = process.argv.slice(1);
            const entry = JSON.parse(fs.readFileSync(file, "utf8"));
            entry.sha256 = sha;
            fs.writeFileSync(file, JSON.stringify(entry, null, 2) + "\n");
          ' "plugins/${{ inputs.pluginId }}/versions/${{ steps.package.outputs.version }}.json" \
            "${{ steps.package.outputs.sha256 }}"
          node scripts/build-catalog.mjs

      - name: Commit the archive and the updated entry
        run: |
          git config user.name "fliks-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          # A wasm archive lives on the plugin repo's release, only a data/node one is committed.
          if [ -z "${{ inputs.version }}" ]; then git add "${{ steps.package.outputs.distPath }}"; fi
          git add "plugins/${{ inputs.pluginId }}/versions/${{ steps.package.outputs.version }}.json" \
                  catalog.json
          # Re-running a signing that already landed is a legitimate operator action, and an
          # Ed25519 signature over identical bytes is identical: nothing staged means nothing to do.
          if git diff --cached --quiet; then
            echo "already published — nothing to commit"
            exit 0
          fi
          git commit -m "chore(${{ inputs.pluginId }}): publish ${{ steps.package.outputs.version }} archive"
          # Another id's run may have pushed between our checkout and here; its commit touches
          # different files, so replaying ours on top is safe and beats failing the whole job.
          git pull --rebase --autostash origin main
          git push

      - name: Attach to a GitHub Release
        if: inputs.version == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.pluginId }}-v${{ steps.package.outputs.version }}"
          # A re-run must land on the release that already exists rather than fail on its tag.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.package.outputs.distPath }}" --clobber
          else
            gh release create "$TAG" \
              "${{ steps.package.outputs.distPath }}" \
              --title "${{ inputs.pluginId }} ${{ steps.package.outputs.version }}" \
              --notes "Signed .fkplugin archive. sha256: ${{ steps.package.outputs.sha256 }}"
          fi

      - name: Republish the Pages site so it picks up the new archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main

      - name: Print what plugins/<id>/versions/<version>.json needs
        if: inputs.version == ''
        run: |
          echo "zipUrl: https://fliks-app.github.io/fliks-plugin-catalog/${{ steps.package.outputs.distPath }}"
          echo "sha256: ${{ steps.package.outputs.sha256 }}"
